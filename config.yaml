project:
  name: sap-btp-buddy
  package: sap_btp_buddy
  documentation_notebook: notebooks/SAP_BTP_Buddy_Submission.ipynb

paths:
  raw_corpus: data/raw
  processed_corpus: data/processed
  index: indexes
  evaluation: artifacts/evaluation
  reports: artifacts/reports

corpus:
  primary_repository: SAP-docs/btp-cloud-platform
  optional_repository: SAP-docs/btp-best-practices-guide
  patterns:
    - "**/*.md"
  language: en
  pinned_commits:
    SAP-docs/btp-cloud-platform: 920e76fb4c59fd82c0e6757040c38f89a02f0374
    SAP-docs/btp-best-practices-guide: 4ac1d8e69d9345d4c7161b42a33615530bd62da0

chunking:
  proposed_strategy: markdown_sections
  comparison_strategy: fixed_tokens
  chunk_size: 400
  chunk_overlap: 60

retrieval:
  proposed_mode: hybrid
  dense_top_k: 10
  lexical_top_k: 10
  final_top_k: 5
  reranker: none

evaluation:
  minimum_questions: 15
  proposed_questions: 20
  final_question_set: eval/questions_final.jsonl

runtime:
  allow_live_generation: true
  generation_model: MiniMaxAI/MiniMax-M3.1-Flash
  embedding_model: intfloat/e5-small-v2
